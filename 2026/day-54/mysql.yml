kind: Pod
apiVersion: v1
metadata:
  name: busybox

spec:
  restartPolicy: Never
  containers:
    - name: busybox
      image: busybox:latest
      env:
        - name: DB_USER
          valueFrom:
              secretKeyRef:
                 name: db-credentials
                 key: DB_USER
      command: ['sh','-c','echo db user is: ${DB_USER}!! && tail -f /dev/null']
      volumeMounts:
        - name: db-cred
          mountPath: /etc/db-credentials
          readOnly: True
     
  volumes:
    - name: db-cred
      secret:
        secretName: db-credentials
