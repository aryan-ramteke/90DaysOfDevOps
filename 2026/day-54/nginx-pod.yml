kind: Pod
apiVersion: v1
metadata:
  name: nginx

spec:
   containers:
      - name: nginx
        image: nginx:latest
        volumeMounts:
          - name: nginx-config
            mountPath: /etc/nginx/conf.d

   volumes:
     - name: nginx-config
       configMap:
         name: nginx-config
           #items:
             #- key: default.conf
               #path:
